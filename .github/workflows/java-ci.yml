name: Java CI with Spotless

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build project
        run: gradlew.bat build --no-daemon

      - name: Run tests
        run: gradlew.bat test --no-daemon

      - name: Check code formatting (Spotless)
        run: gradlew.bat spotlessCheck --no-daemon
